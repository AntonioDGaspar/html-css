<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulários </title>
</head>
<body></body>
    <h1> Teste de Formulários </h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="nome"> Nome: </label>
            <input type="text" name="nome" id="nome" placeholder="Nome Completo" required>
        </p>
        <p>
            <label for="media"> Média: </label>
            <input type="number" name="media" id="media" placeholder="0 a 10" min="0" max="5" required step="0.1">
        </p>
        <p>
            <label for="Período Lectivio"> Período Lectivio: </label>
            <input type="month" name="mes" id="mes" value="2025-04">
        </p>
        <p>
            <label for="dia"> Dia da Prova: </label>
            <input type="date" name="dia" id="dia" value="2025-04-27">
        </p>
        <p>
            <label for="hora"> Horário da Prova: </label>
            <input type="time" name="hora" id="hora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
