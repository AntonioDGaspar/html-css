<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulário </title>
</head>
<body>
    <form action="cadastro.php">
        <p>
            <label for="n1"> Número 1: </label>
            <input type="number" name="n1" id="n1" required oninput="som.innerHTML = Number(n1.value) + Number(n2.value)">
        </p>
        <p>
            <label for="n2"> Número 2: </label>
            <input type="number" name="n2" id="n2" required oninput="som.innerHTML = Number(n1.value) + Number(n2.value)">
        </p>
        <p>
            <label for="som"> Soma: </label>
            <output name="som" id="som">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
